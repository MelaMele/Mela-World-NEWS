name: Sports Bot Runner

on:
  schedule:
    # በየሰዓቱ በደቂቃ 0 ላይ ይነሳል (Every 1 hour)
    - cron: '0 * * * *'
  workflow_dispatch: # በእጅ (Manually) ማስነሳት ሲፈለግ

permissions:
  contents: write # ለ Git Push ስልጣን ለመስጠት

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # የDependency ፍጥነትን ይጨምራል

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scraper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: python main.py

      - name: Commit and push sent news database
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sent_news.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update sent news history" && git push)
